<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f1">
  <title>Подарок для тебя!</title>
  <style>
    :root { color-scheme: light; --ink:#402b42; --pink:#ef6d8b; --gold:#f5c45d; --paper:#fff8f1; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100svh; display:grid; place-items:center; overflow:hidden; padding:24px; color:var(--ink); font-family: ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 50% 42%,#fffefa 0,#fff8f1 42%,#fbe5ed 100%); }
    body:before,body:after { content:""; position:fixed; z-index:0; width:min(78vw,520px); aspect-ratio:1; border-radius:50%; filter:blur(2px); pointer-events:none; }
    body:before { top:-34vw; left:-30vw; background:radial-gradient(circle,#f3bfd0a8 0,transparent 70%); }
    body:after { right:-34vw; bottom:-36vw; background:radial-gradient(circle,#f9d88a88 0,transparent 70%); }
    .scene { width:min(100%,680px); text-align:center; position:relative; z-index:1; padding:clamp(26px,6vh,54px) 18px; }
    .eyebrow { display:none; }
    h1 { margin:0; font-size:clamp(2rem,8vw,3.7rem); line-height:1.04; letter-spacing:-.045em; text-wrap:balance; }
    .hint { margin:15px 0 0; color:#806d7e; font-size:clamp(1rem,3.8vw,1.15rem); }
    .birth-form { width:min(100%,360px); margin:clamp(22px,4vh,34px) auto 0; }
    .birth-form label { display:block; margin-bottom:11px; font-size:1.13rem; font-weight:750; }
    .date-row { display:flex; gap:9px; }
    .birth-form input { min-width:0; flex:1; padding:14px 16px; border:1px solid #dfc9d3; border-radius:15px; color:var(--ink); background:#fff; font:inherit; box-shadow:0 6px 20px #7548610d; }
    .birth-form input::placeholder { color:#ad9aa5; opacity:1; }
    .birth-form input:focus-visible { outline:3px solid #d889a3; outline-offset:2px; }
    .birth-form button { padding:0 17px; border:0; border-radius:15px; background:linear-gradient(135deg,#ef7790,#dc587b); color:#fff; font:inherit; font-weight:750; box-shadow:0 8px 18px #cb688133; cursor:pointer; }
    .birth-form button:active { transform:translateY(1px); }
    .error { min-height:1.4em; margin:10px 0 0; color:#b43e62; font-size:.93rem; }
    .confirm-layer { position:fixed; inset:0; z-index:3; display:grid; place-items:center; padding:22px; background:#402b4266; backdrop-filter:blur(8px); opacity:0; visibility:hidden; transition:opacity .25s,visibility .25s; }
    .confirm-layer.open { opacity:1; visibility:visible; }
    .confirm-card { width:min(100%,390px); padding:30px 24px 24px; border:1px solid #fff; border-radius:28px; background:linear-gradient(145deg,#fffefa,#fff0f2); box-shadow:0 24px 80px #402b4240; transform:translateY(12px) scale(.97); transition:transform .25s; }
    .confirm-layer.open .confirm-card { transform:translateY(0) scale(1); }
    .confirm-icon { margin:0 0 10px; font-size:2.4rem; }
    .confirm-card h2 { margin:0; font-size:clamp(1.5rem,6vw,1.9rem); line-height:1.15; }
    .confirm-answers { display:flex; gap:12px; margin-top:24px; }
    .confirm-answers button { flex:1; min-height:52px; border:0; border-radius:16px; color:white; background:linear-gradient(135deg,#ef7790,#dc587b); font:inherit; font-size:1.1rem; font-weight:800; cursor:pointer; box-shadow:0 8px 18px #cb688133; }
    .scene.gift-ready .eyebrow,.scene.gift-ready h1 { display:none; }
    .scene.gift-ready .hint { margin-top:3px; color:#704c68; font-size:clamp(1.8rem,7vw,2.6rem); font-weight:900; letter-spacing:-.035em; text-shadow:0 3px 0 #fff,0 9px 24px #714b681c; }
    .scene.gift-ready .gift-button { margin-top:12px; width:min(92vw,490px); }
    [hidden] { display:none !important; }
    .gift-button { display:block; margin:clamp(20px,4vh,34px) auto 0; padding:4px; width:min(88vw,430px); aspect-ratio:1; border:0; border-radius:38px; background:transparent; cursor:pointer; -webkit-tap-highlight-color:transparent; filter:drop-shadow(0 25px 25px #cb688144); transition:transform .25s ease,filter .25s ease; }
    .gift-button:hover { transform:translateY(-7px) rotate(-2deg); filter:drop-shadow(0 30px 24px #cb688155); }
    .gift-button:focus-visible,.close:focus-visible { outline:4px solid #60446a; outline-offset:5px; }
    .gift { display:block; width:100%; height:100%; position:relative; animation:bob 2.8s ease-in-out infinite; }
    .box { position:absolute; width:74%; height:53%; left:13%; bottom:5%; border-radius:7px 7px 22px 22px; background:linear-gradient(90deg,#e81126 0%,#fb2639 18%,#ed172a 54%,#ce0719 100%); box-shadow:inset -12px -8px 0 #bb0618,inset 9px 0 0 #ff4b53,0 12px 20px #a5142830; }
    .box:before { content:""; position:absolute; left:40%; top:0; width:20%; height:100%; background:linear-gradient(90deg,#13bfd0,#42e6e5 48%,#09a9be); box-shadow:2px 0 5px #087d8b44; }
    .box:after { content:""; position:absolute; left:0; right:0; top:0; height:16%; border-radius:6px 6px 0 0; background:linear-gradient(180deg,#ff5660,#ec1d30); }
    .lid { position:absolute; width:86%; height:18%; left:7%; bottom:55%; border-radius:8px 8px 4px 4px; background:linear-gradient(100deg,#ff3544 0%,#ef1429 58%,#d90920 100%); box-shadow:inset 0 -7px 0 #bd0819,0 5px 8px #8b0b1d33; }
    .lid:before { content:""; position:absolute; left:42%; top:0; width:16%; height:100%; background:linear-gradient(90deg,#11b9ca,#49e3e3 50%,#079fb4); }
    .bow { position:absolute; left:50%; bottom:68%; width:64%; height:34%; transform:translateX(-50%); }
    .bow:before,.bow:after { content:""; position:absolute; width:44%; height:65%; top:0; background:linear-gradient(135deg,#5af3f0 0%,#11bfd0 54%,#078fa9 100%); box-shadow:inset 5px 4px 8px #b8ffff77,3px 5px 7px #00697644; }
    .bow:before { left:3%; border-radius:85% 18% 72% 30%; transform:rotate(17deg) skewY(-8deg); }
    .bow:after { right:3%; border-radius:18% 85% 30% 72%; transform:rotate(-17deg) skewY(8deg); }
    .bow-knot { position:absolute; z-index:2; width:19%; height:22%; left:40.5%; top:28%; border-radius:40%; background:linear-gradient(135deg,#72ffff,#09adbf 75%); box-shadow:inset 2px 2px 5px #d6ffffaa,0 3px 7px #00697655; }
    .bow-tail { position:absolute; z-index:-1; top:40%; width:17%; height:67%; background:linear-gradient(90deg,#17bdca,#55ece6 55%,#078fa9); box-shadow:inset 3px 0 4px #b8ffff88; }
    .bow-tail.left { left:26%; clip-path:polygon(0 0,100% 0,85% 100%,42% 82%,10% 100%); transform:rotate(14deg); }
    .bow-tail.right { right:26%; clip-path:polygon(0 0,100% 0,90% 100%,55% 82%,15% 100%); transform:rotate(-14deg); }
    .gift.opening { animation:gift-pop 1.35s cubic-bezier(.2,.72,.2,1) both; }
    .gift.opening .lid { transform-origin:15% 100%; animation:lid-open 1.2s cubic-bezier(.18,.72,.22,1) .3s both; }
    .gift.opening .bow:before { animation:bow-loop-left .65s ease-in both; }
    .gift.opening .bow:after { animation:bow-loop-right .65s ease-in both; }
    .gift.opening .bow-knot { animation:knot-loose .55s ease-in both; }
    .gift.opening .bow-tail { animation:tail-loose .8s ease-in both; }
    .gift.opening .bow { animation:bow-away .85s ease-in .45s both; }
    .sparkle { position:absolute; color:var(--gold); font-size:32px; animation:twinkle 2s ease-in-out infinite; }
    .s1 { left:4%; top:33%; }.s2 { right:3%; top:44%; animation-delay:.7s }.s3 { right:14%; top:8%; font-size:22px; animation-delay:1.2s }
    .video-layer { position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:20px; background:#201729ed; opacity:0; visibility:hidden; transition:opacity .35s,visibility .35s; }
    .video-layer.open { opacity:1; visibility:visible; }
    .video-layer.waiting { opacity:0; visibility:hidden; }
    .video-card { width:min(92vw,440px); position:relative; transform:translateY(16px) scale(.98); transition:transform .35s; }
    .open .video-card { transform:translateY(0) scale(1); }
    video { display:block; width:100%; height:min(78svh,780px); aspect-ratio:9/16; object-fit:contain; background:#120f15; border-radius:22px; box-shadow:0 28px 90px #0008; }
    .close { position:absolute; right:0; bottom:calc(100% + 12px); width:42px; height:42px; border:1px solid #ffffff55; border-radius:50%; color:#fff; background:#ffffff20; font-size:25px; cursor:pointer; }
    .video-note { color:#fff; text-align:center; margin:16px 0 0; font-size:.95rem; }
    .confetti { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:4; }
    .piece { position:absolute; top:-20px; width:9px; height:15px; border-radius:2px; animation:fall var(--duration) linear forwards; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    @keyframes gift-pop { 0%,35%{transform:translateY(0) scale(1)} 15%{transform:translateY(-12px) scale(1.035)} 100%{transform:translateY(9px) scale(.96)} }
    @keyframes lid-open { 0%{transform:translate(0,0) rotate(0)} 42%{transform:translate(-8px,-15px) rotate(-5deg)} 100%{transform:translate(-70px,-175px) rotate(-27deg);opacity:0} }
    @keyframes bow-away { 0%{transform:translateX(-50%) scale(1);opacity:1} 100%{transform:translate(-50%,-125px) rotate(13deg) scale(.72);opacity:0} }
    @keyframes bow-loop-left { to{transform:translate(-22px,-24px) rotate(-28deg) scale(.72);opacity:0} }
    @keyframes bow-loop-right { to{transform:translate(22px,-24px) rotate(28deg) scale(.72);opacity:0} }
    @keyframes knot-loose { to{transform:translateY(-22px) rotate(40deg) scale(.6);opacity:0} }
    @keyframes tail-loose { to{transform:translateY(18px) rotate(12deg);opacity:0} }
    @keyframes twinkle { 0%,100%{opacity:.45;transform:scale(.8) rotate(0)} 50%{opacity:1;transform:scale(1.15) rotate(18deg)} }
    @keyframes fall { to { transform:translate3d(var(--drift),110svh,0) rotate(780deg); opacity:.9 } }
    @media (max-height:700px) and (orientation:landscape) { .scene { padding:12px; }.gift-button { width:min(42vh,280px); margin-top:8px; }.eyebrow { margin-bottom:8px; }h1 { font-size:clamp(1.7rem,6vh,2.6rem); }.hint { margin-top:8px; } }
    @media (prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; transition-duration:.01ms!important } }
  </style>
</head>
<body>
  <main class="scene" id="greeting">
    <p class="eyebrow">секретный подарок для Сёмы</p>
    <h1>Для тебя приготовили сюрприз</h1>
    <form class="birth-form" id="birthForm">
      <label for="birthDate">Ваша дата рождения?</label>
      <div class="date-row">
        <input id="birthDate" name="birthDate" type="text" inputmode="numeric" autocomplete="bday" placeholder="ДД.ММ.ГГГГ" maxlength="10" required aria-describedby="birthError">
        <button type="submit">Проверить</button>
      </div>
      <p class="error" id="birthError" aria-live="polite"></p>
    </form>
    <p class="hint" id="openHint" hidden>Дата верная! Теперь открой свой подарок ✨</p>
    <button class="gift-button" id="openGift" aria-label="Открыть подарок" hidden>
      <span class="gift" aria-hidden="true"><i class="sparkle s1">✦</i><i class="sparkle s2">✧</i><i class="sparkle s3">✦</i><span class="box"></span><span class="lid"></span><span class="bow"><i class="bow-tail left"></i><i class="bow-tail right"></i><i class="bow-knot"></i></span></span>
    </button>
  </main>
  <section class="confirm-layer" id="confirmLayer" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-card">
      <p class="confirm-icon" aria-hidden="true">🎂</p>
      <h2 id="confirmTitle">У тебя точно сегодня день рождения?</h2>
      <div class="confirm-answers">
        <button type="button" class="confirmYes">Да!</button>
        <button type="button" class="confirmYes">Да!</button>
      </div>
    </div>
  </section>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <section class="video-layer" id="videoLayer" role="dialog" aria-modal="true" aria-label="Видео поздравление">
    <div class="video-card">
      <button class="close" id="closeVideo" aria-label="Закрыть видео">×</button>
      <video id="birthdayVideo" controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4">
        Твой браузер не поддерживает воспроизведение видео.
      </video>
      <p class="video-note">С днём рождения! 🎂</p>
    </div>
  </section>
  <script>
    const layer = document.getElementById('videoLayer');
    const video = document.getElementById('birthdayVideo');
    const openButton = document.getElementById('openGift');
    const confetti = document.getElementById('confetti');
    const birthForm = document.getElementById('birthForm');
    const birthDate = document.getElementById('birthDate');
    const birthError = document.getElementById('birthError');
    const confirmLayer = document.getElementById('confirmLayer');
    birthForm.addEventListener('submit', event => {
      event.preventDefault();
      const enteredDate = birthDate.value.trim().replace(/\//g, '.').replace(/-/g, '.');
      if (/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(enteredDate) && enteredDate.split('.').map((part, i) => i < 2 ? part.padStart(2, '0') : part).join('.') === '12.11.1996') {
        birthError.textContent = '';
        birthForm.hidden = true;
        confirmLayer.classList.add('open');
        confirmLayer.querySelector('.confirmYes').focus();
      } else {
        birthError.textContent = 'Похоже, дата не совпала. Попробуй ещё раз.';
        birthDate.focus();
      }
    });
    document.querySelectorAll('.confirmYes').forEach(button => button.addEventListener('click', () => {
      confirmLayer.classList.remove('open');
      const hint = document.getElementById('openHint');
      hint.textContent = 'Открой подарок';
      hint.hidden = false;
      openButton.hidden = false;
      document.getElementById('greeting').classList.add('gift-ready');
      openButton.focus();
    }));
    function celebrate() {
      const colors = ['#ef6d8b','#f5c45d','#8c72c9','#66c6a5','#ffffff'];
      for (let i=0; i<70; i++) {
        const piece = document.createElement('i');
        piece.className = 'piece';
        piece.style.left = `${Math.random()*100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty('--duration', `${2.2 + Math.random()*2.1}s`);
        piece.style.setProperty('--drift', `${(Math.random()-.5)*260}px`);
        piece.style.animationDelay = `${Math.random()*.7}s`;
        confetti.appendChild(piece);
        piece.addEventListener('animationend', () => piece.remove(), {once:true});
      }
    }
    openButton.addEventListener('click', () => {
      if (openButton.disabled) return;
      openButton.disabled = true;
      document.querySelector('.gift').classList.add('opening');
      celebrate();
      window.setTimeout(() => {
        layer.classList.add('open');
        video.play().catch(() => {}); // Some browsers require a second tap on the video.
        document.getElementById('closeVideo').focus();
      }, 1500);
    });
    function closeVideo() { video.pause(); layer.classList.remove('open'); openButton.focus(); }
    document.getElementById('closeVideo').addEventListener('click', closeVideo);
    layer.addEventListener('click', e => { if (e.target === layer) closeVideo(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.classList.contains('open')) closeVideo(); });
  </script>
</body>
</html>
